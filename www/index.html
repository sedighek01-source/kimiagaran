<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B3E">
<title>کیمیاگر</title>
<style>
@font-face { font-family: 'Peyda'; src: url('fonts/peyda.woff') format('woff'); font-weight: 400; font-display: block; }

:root {
  --bg: #F6EFDF;
  --paper: #FFFBF2;
  --line: #E7DCC4;
  --ink: #26261F;
  --muted: #7B7462;
  --g900: #102419;
  --g800: #16372A;
  --g700: #1E5B3E;
  --g600: #2A7650;
  --g100: #E4EEDD;
  --gold: #C4952B;
  --gold2: #E9C766;
  --goldbg: #FBF0D2;
  --danger: #B5523F;
  --r: 18px;
  --shadow: 0 2px 10px rgba(70, 55, 20, .08);
  --nav: 68px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  font-family: 'Peyda', 'Noto Sans Arabic', sans-serif;
  color: var(--ink); font-size: 15px; line-height: 1.75;
  direction: rtl; overflow: hidden; user-select: none; -webkit-user-select: none;
}
input, textarea, button { font: inherit; color: inherit; }
textarea, input { user-select: text; -webkit-user-select: text; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, p { margin: 0; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; }
.screen.with-nav { padding-bottom: calc(var(--nav) + 16px); }
.pad { padding: 20px 18px; }
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.bold { font-weight: 700; }
.gold { color: var(--gold); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 12px; }
.fade-in { animation: fadeIn .28s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 52px; border-radius: 26px; padding: 0 20px;
  background: var(--g700); color: #fff; font-weight: 700; font-size: 16px;
  box-shadow: 0 4px 14px rgba(30, 91, 62, .28);
  transition: transform .12s ease, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--g700); box-shadow: none; border: 1.5px solid var(--g700); }
.btn.light { background: rgba(255,255,255,.12); color: #fff; border: 1.5px solid rgba(255,255,255,.7); box-shadow: none; }
.btn.soft { background: var(--g100); color: var(--g700); box-shadow: none; }
.btn.sm { min-height: 40px; font-size: 14px; width: auto; padding: 0 16px; }
.link { color: var(--g700); font-weight: 700; font-size: 14px; padding: 8px 4px; }
.arrow { font-size: 18px; line-height: 1; }

/* Cards */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.card.tight { padding: 12px 14px; }
.section-title { font-weight: 700; font-size: 16px; margin: 22px 2px 10px; display: flex; justify-content: space-between; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font-size: 12px; background: var(--g100); color: var(--g700); font-weight: 700; }
.chip.gold { background: var(--goldbg); color: #8A6413; }
.xp { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: #8A6413; font-size: 13px; white-space: nowrap; }
.flask { width: 16px; height: 16px; flex: none; }

/* Onboarding */
.ob { min-height: 100vh; display: flex; flex-direction: column; padding: 28px 20px 22px; }
.ob h2 { font-size: 21px; text-align: center; line-height: 1.6; margin-top: 8px; }
.ob .sub { text-align: center; color: var(--muted); font-size: 13px; margin-top: 4px; }
.ob .body { flex: 1; margin-top: 20px; }
.ob .foot { margin-top: 18px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #D5CBB3; transition: width .2s; }
.dots i.on { width: 18px; background: var(--g700); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 16px 10px; text-align: center; transition: all .15s; position: relative;
}
.opt .ic { font-size: 34px; line-height: 1.3; display: block; }
.opt .t { font-weight: 700; margin-top: 4px; display: block; }
.opt.sel { border-color: var(--g700); background: #EFF5EA; box-shadow: 0 0 0 3px rgba(30,91,62,.12); }
.opt.sel::after { content: '✓'; position: absolute; top: 8px; left: 10px; width: 20px; height: 20px; border-radius: 10px; background: var(--g700); color: #fff; font-size: 12px; line-height: 20px; }
.optrow { display: flex; align-items: center; gap: 14px; text-align: right; padding: 14px 16px; }
.optrow .ic { font-size: 30px; }
.optrow.sel::after { top: 50%; margin-top: -10px; }

.list-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; }
.list-opt + .list-opt { margin-top: 8px; }
.list-opt .ic { font-size: 22px; width: 30px; text-align: center; }
.list-opt.sel { border-color: var(--g700); background: #EFF5EA; }
.check { width: 24px; height: 24px; border-radius: 12px; border: 2px solid #CFC4AA; flex: none; display: grid; place-items: center; color: #fff; font-size: 13px; transition: all .15s; }
.sel .check, .check.on { background: var(--g700); border-color: var(--g700); }

.field { width: 100%; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; font-size: 16px; outline: none; resize: none; }
.field:focus { border-color: var(--g700); }
label.lbl { display: block; font-weight: 700; font-size: 14px; margin: 14px 2px 6px; }

/* Hero & dark scenes */
.hero { position: relative; min-height: 100vh; color: #fff; display: flex; flex-direction: column; overflow: hidden; }
.hero .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .content { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; padding: 34px 22px 26px; }
.logo { width: 74px; height: 74px; margin: 0 auto; display: block; }
.brand { font-size: 34px; font-weight: 700; text-align: center; color: var(--g800); margin-top: 6px; letter-spacing: -.5px; }
.hero .tag { text-align: center; color: var(--g800); font-size: 15px; margin-top: 6px; }
.dark { background: linear-gradient(180deg, #0E1F17 0%, #173A2A 55%, #1E3F2C 100%); color: #F3EBD6; }

.flow { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 26px 0 8px; }
.flow .node { display: flex; align-items: center; gap: 14px; }
.flow .orb { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 30px;
  background: radial-gradient(circle at 50% 40%, #2E6A4A, #13301F); border: 2px solid var(--gold2); box-shadow: 0 0 22px rgba(233,199,102,.45); }
.flow .lbl2 { width: 90px; font-weight: 700; color: var(--gold2); }
.flow .lbl2 small { display: block; color: #E7DDC5; font-weight: 400; }
.flow .down { color: var(--gold2); font-size: 18px; margin-left: 104px; }

/* Header */
.head { padding: 22px 18px 6px; }
.head h1 { font-size: 22px; }
.head .date { font-size: 12px; color: var(--muted); }

/* Mission card */
.mission-hero { border-radius: 22px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); }
.mission-hero .top { position: relative; height: 112px; }
.mission-hero .top svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mission-hero .badge { position: absolute; bottom: -26px; right: 50%; transform: translateX(50%); width: 60px; height: 60px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--gold2); display: grid; place-items: center; font-size: 30px; box-shadow: var(--shadow); }
.mission-hero .inner { padding: 32px 16px 16px; text-align: center; }
.mission-hero h3 { font-size: 18px; }
.meta3 { display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.meta3 > div { padding: 10px 4px; text-align: center; font-size: 12px; color: var(--muted); }
.meta3 > div + div { border-right: 1px solid var(--line); }
.meta3 b { display: block; color: var(--ink); font-size: 13px; }

/* Routine row */
.rt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.rt + .rt { border-top: 1px solid var(--line); }
.rt .ic { font-size: 22px; width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; flex: none; }
.rt .t { font-weight: 700; font-size: 14px; }
.rt.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.25); }
.rt .tick { width: 44px; height: 44px; display: grid; place-items: center; margin: -6px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px; text-align: center; }
.stat .v { font-size: 20px; font-weight: 700; display: block; line-height: 1.4; }
.stat .k { font-size: 12px; color: var(--muted); }

.world-preview { position: relative; height: 130px; border-radius: 20px; overflow: hidden; display: block; width: 100%; }
.world-preview svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.world-preview .cta { position: absolute; left: 12px; bottom: 12px; background: rgba(16,36,25,.78); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }
.world-preview .lbl3 { position: absolute; right: 14px; top: 12px; color: #fff; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

.micro-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; padding: 14px 16px; border-radius: 16px; background: var(--g100); border: 1px dashed #A9C4A1; }
.micro-btn .ic { font-size: 24px; }

/* Bottom nav */
.nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav); background: var(--paper); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20; box-shadow: 0 -4px 16px rgba(70,55,20,.06); }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #9A927E; font-size: 11px; }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { color: var(--g700); font-weight: 700; }
.nav button.on svg { stroke-width: 2.2; }

/* Tabs */
.tabs { display: flex; background: #EDE4CF; border-radius: 14px; padding: 4px; gap: 4px; }
.tabs button { flex: 1; padding: 8px 4px; border-radius: 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.tabs button.on { background: var(--paper); color: var(--g700); box-shadow: var(--shadow); }

.filter { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.filter::-webkit-scrollbar { display: none; }
.filter button { flex: none; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--paper); font-size: 13px; }
.filter button.on { background: var(--g700); color: #fff; border-color: var(--g700); }

.mcard { display: flex; gap: 12px; align-items: flex-start; text-align: right; width: 100%; }
.mcard .ic { font-size: 26px; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.mcard h4 { margin: 0; font-size: 15px; }
.mcard + .mcard { margin-top: 10px; }
.donebadge { color: var(--g700); font-size: 12px; font-weight: 700; }
.diff { letter-spacing: 1px; color: var(--gold); font-size: 11px; }

/* Mission detail */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0; }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; font-size: 20px; color: var(--ink); }
.block { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.block h5 { margin: 0 0 4px; font-size: 13px; color: var(--g700); }

/* Timer */
.timer-ring { width: 170px; height: 170px; margin: 18px auto; position: relative; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 700; direction: ltr; color: var(--g800); }

/* Result */
.scale { display: flex; justify-content: space-between; gap: 8px; direction: rtl; }
.scale button { flex: 1; height: 44px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; }
.scale button.on { background: var(--g700); color: #fff; border-color: var(--g700); }
.feel { display: flex; justify-content: space-between; gap: 6px; }
.feel button { flex: 1; padding: 8px 2px; border-radius: 14px; border: 1.5px solid transparent; font-size: 11px; color: var(--muted); }
.feel button span { font-size: 28px; display: block; line-height: 1.3; }
.feel button.on { border-color: var(--g700); background: #EFF5EA; color: var(--g700); font-weight: 700; }
.outcome { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.outcome button { padding: 12px 6px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper); font-size: 13px; font-weight: 700; }
.outcome button.on { border-color: var(--g700); background: #EFF5EA; color: var(--g700); }

/* Success */
.reward { text-align: center; padding-top: 30px; }
.reward .glow { width: 150px; height: 150px; margin: 10px auto 0; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle, rgba(233,199,102,.55) 0%, rgba(233,199,102,0) 70%); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.reward .amt { font-size: 40px; font-weight: 700; color: var(--gold2); direction: ltr; line-height: 1.3; }
.insight { background: rgba(255,255,255,.08); border: 1px solid rgba(233,199,102,.45); border-radius: 18px; padding: 16px; margin-top: 18px; text-align: right; }

/* Mirror */
.weekbox { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.weekbox .v { font-size: 20px; font-weight: 700; }
.ins { display: flex; gap: 12px; }
.ins .q { font-size: 22px; }
.bar { height: 8px; border-radius: 4px; background: #EDE4CF; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }

/* World */
.worldmap { position: relative; width: 100%; aspect-ratio: 3 / 4.3; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
.worldmap > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin { position: absolute; transform: translate(-50%, -30%); display: flex; flex-direction: column; align-items: center; text-align: center; width: 110px; }
.pin .o { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; border: 2px solid var(--gold2);
  background: radial-gradient(circle at 50% 35%, #3C8A5C, #154129); box-shadow: 0 0 18px rgba(233,199,102,.6); }
.pin.locked .o { background: rgba(20,30,24,.72); border-color: rgba(255,255,255,.55); box-shadow: none; font-size: 20px; }
.pin .n { margin-top: 4px; background: rgba(16,36,25,.82); color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pin .req { font-size: 10.5px; color: #fff; background: rgba(0,0,0,.45); border-radius: 8px; padding: 1px 6px; margin-top: 2px; line-height: 1.6; }

/* Profile */
.avatar { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto; border: 3px solid var(--gold2); overflow: hidden; box-shadow: 0 0 20px rgba(233,199,102,.5); background: #2A6A48; display: grid; place-items: center; font-size: 42px; }
.crys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; text-align: center; }
.crys div { font-size: 26px; filter: grayscale(1) opacity(.35); }
.crys div.on { filter: none; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 14px 4px; min-height: 52px; }
.setrow + .setrow { border-top: 1px solid var(--line); }
.switch { width: 48px; height: 28px; border-radius: 14px; background: #D3C9B0; position: relative; flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; transition: right .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch.on { background: var(--g700); }
.switch.on::after { right: 23px; }
input[type=time] { direction: ltr; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 15px; min-height: 40px; }
.days { display: flex; gap: 5px; flex-wrap: wrap; }
.days button { width: 38px; height: 38px; border-radius: 19px; border: 1.5px solid var(--line); background: var(--paper); font-size: 13px; }
.days button.on { background: var(--g700); color: #fff; border-color: var(--g700); }

/* Sheet & toast */
.overlay { position: fixed; inset: 0; background: rgba(16, 26, 20, .45); z-index: 40; display: flex; align-items: flex-end; animation: fadeIn .2s; }
.sheet { background: var(--bg); width: 100%; max-height: 88%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 10px 18px 24px; animation: up .25s ease; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #CFC4AA; margin: 0 auto 12px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav) + 14px); background: var(--g800); color: #fff; padding: 12px 16px; border-radius: 14px; z-index: 60; font-size: 14px; animation: fadeIn .2s; text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 14px; }
.empty .ic { font-size: 36px; display: block; margin-bottom: 6px; }
.warn { background: #FCEBDD; border: 1px solid #EDC3A3; color: #7A3E1C; border-radius: 14px; padding: 12px 14px; font-size: 13px; }
.note { background: var(--goldbg); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #6C5212; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

</style>
</head>
<body>
<div id="app"></div>
<script>
// کیمیاگر — محتوای پایه MVP (نسخه 1.1)
window.DATA = {
  paths: [
    { id: 'self',      name: 'خودشناسی', icon: '🪞', color: '#4A7FB5', region: 'forest' },
    { id: 'courage',   name: 'شجاعت',    icon: '🦁', color: '#D9822B', region: 'mountain' },
    { id: 'action',    name: 'اقدام',     icon: '🎯', color: '#2E8B57', region: 'plain' },
    { id: 'relations', name: 'روابط',     icon: '❤️', color: '#C8463D', region: 'village' },
    { id: 'calm',      name: 'آرامش',    icon: '🪷', color: '#3FA7A0', region: 'lake' },
    { id: 'meaning',   name: 'معنا',      icon: '⭐', color: '#8E6BB5', region: 'land' }
  ],

  // related: مسیرهای نزدیک (برای سهم ۲۰٪ تنوع مرتبط)
  related: {
    self: ['calm', 'meaning'], courage: ['action', 'relations'], action: ['courage', 'self'],
    relations: ['courage', 'calm'], calm: ['self', 'relations'], meaning: ['self', 'action']
  },

  timeOptions: [
    { min: 5,  title: '۵ دقیقه',  sub: 'قدم‌های کوچک', icon: '🌱' },
    { min: 15, title: '۱۵ دقیقه', sub: 'رشد متعادل', icon: '🌿' },
    { min: 30, title: '۳۰ دقیقه', sub: 'سفر عمیق‌تر', icon: '🌳' },
    { min: 0,  title: 'بعداً خودم تنظیم می‌کنم', sub: 'پیش‌فرض: ۱۵ دقیقه', icon: '⏳' }
  ],

  routineTemplates: [
    { key: 'book',     title: '۳ صفحه کتاب',          icon: '📖', xp: 10, path: 'self',      time: '21:30', note: '📖 وقت ۳ صفحه کتاب امروزته. فقط یک قدم.' },
    { key: 'walk',     title: '۱۵ دقیقه پیاده‌روی',    icon: '🚶', xp: 15, path: 'calm',      time: '18:00', note: '🚶 ۱۵ دقیقه برای خودت؛ همین امروز.' },
    { key: 'sport',    title: '۱۵ دقیقه ورزش',        icon: '💪', xp: 15, path: 'action',    time: '07:30', note: '💪 ۱۵ دقیقه حرکت؛ بدنت ممنونت می‌شود.' },

<script>
/* کیمیاگر — منطق اپ (local-first، بدون نیاز به اینترنت) */
(function () {
  'use strict';
  const D = window.DATA, ART = window.ART;
  const AB = window.Android || null; // پل بومی اندروید (اعلان‌ها)
  const KEY = 'daily_actions_v1';

  // ---------- Utilities ----------
  const nf = new Intl.NumberFormat('fa-IR');
  const fa = (n) => nf.format(n);
  const faT = (s) => String(s).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const today = () => dayKey();
  const parseDay = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
  const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const pathOf = (id) => D.paths.find((p) => p.id === id) || D.paths[0];
  const allMissions = () => D.missions.concat(D.hidden);
  const missionById = (id) => allMissions().find((m) => m.id === id);
  const uidGen = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const jalali = (() => { try { return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return null; } })();
  const dayNames = ['ی', 'د', 'س', 'چ', 'پ', 'ج', 'ش']; // index = JS getDay (0=یکشنبه)
  const dayOrder = [6, 0, 1, 2, 3, 4, 5]; // نمایش از شنبه

  // ---------- State ----------
  const defaults = () => ({
    v: 1, onboarded: false, created: today(),
    name: '', paths: [], dailyMin: 15, intention: '',
    routines: [], routineLog: {}, micros: [],
    records: [], insights: [], active: null,
    day: { date: '', missionId: null, swaps: 0 },
    seenRegions: ['forest'], lastSeen: today(),
    settings: { notif: true, mission: true, missionTime: '10:00', morning: true, morningTime: '08:30', quietOn: true, quietStart: '23:30', quietEnd: '07:00', permAsked: false }
  });
  let S;
  try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || '{}')); S.settings = Object.assign(defaults().settings, S.settings || {}); }
  catch (e) { S = defaults(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('ذخیره‌سازی ممکن نشد. فضای دستگاه را بررسی کن.'); } };

  const ui = { tab: 'home', screen: null, params: {}, sheet: null, ob: 0, draft: {}, filter: 'all', mirrorTab: 'finds' };

  // ---------- Derived stats ----------
  function stats() {
    let xp = 0, steps = 0;
    const pathSteps = {}, pathMissions = {}, dayCount = {};
    D.paths.forEach((p) => { pathSteps[p.id] = 0; pathMissions[p.id] = 0; });
    const bump = (date, path, n) => { dayCount[date] = (dayCount[date] || 0) + n; if (path) pathSteps[path] = (pathSteps[path] || 0) + n; };
    Object.keys(S.routineLog).forEach((d) => S.routineLog[d].forEach((r) => { xp += r.xp; steps++; bump(d, r.path, 1); }));
    S.micros.forEach((m) => { xp += 5; steps++; bump(m.date, null, 1); });
    S.records.forEach((r) => {
      xp += r.xp || 0;
      if (r.status === 'done') { steps++; bump(r.date, r.path, 1); pathMissions[r.path] = (pathMissions[r.path] || 0) + 1; }
    });
    const level = Math.floor(Math.sqrt(xp / 40)) + 1;
    const nextAt = 40 * level * level, prevAt = 40 * (level - 1) * (level - 1);
    // شعله غیرتنبیهی: یک روز استراحت زنجیره را قطع نمی‌کند
    const active = Object.keys(dayCount).filter((d) => dayCount[d] > 0).sort().reverse();
    let flame = 0;
    if (active.length && daysBetween(active[0], today()) <= 2) {
      flame = 1;
      for (let i = 1; i < active.length; i++) { if (daysBetween(active[i], active[i - 1]) <= 2) flame++; else break; }
    }
    const savedIns = S.insights.filter((i) => i.saved).length;
    const crystals = {
      courage: pathMissions.courage >= 3, streak: flame >= 7, aware: savedIns >= 5,
      bond: pathMissions.relations >= 3, peace: pathSteps.calm >= 10, meaning: pathMissions.meaning >= 3

    let adj = 0;

  function pickMission(seedExtra, forcePath, maxD) {
    const doneIds = new Set(S.records.filter((r) => r.status === 'done').map((r) => r.mid));
    const r = rng(hashStr(today() + '|' + (seedExtra || 0) + '|' + S.name));
    const chosen = S.paths.length ? S.paths : ['action'];
    let path = forcePath;
    if (!path) {
      const x = r();
      if (x < 0.4) path = chosen[0];

      else if (x < 0.9) { const rel = D.related[chosen[Math.floor(r() * chosen.length)]]; path = rel[Math.floor(r() * rel.length)]; }
      else { const others = D.paths.map((p) => p.id).filter((p) => !chosen.includes(p)); path = others.length ? others[Math.floor(r() * others.length)] : chosen[0]; }

    if (!pool.length) pool = D.missions.filter((m) => m.path === path && m.id !== S.day.missionId);

    if (fit.length) pool = fit;
    pool.sort((a, b) => Math.abs(a.d - td) - Math.abs(b.d - td) || a.min - b.min);

    const jobs = [];
    if (!S.settings.notif) return jobs;
    const T = 'کیمیاگر';
    const hm = (t) => t.split(':').map(Number);
    if (S.settings.morning && !inQuiet(S.settings.morningTime)) { const [h, m] = hm(S.settings.morningTime); jobs.push({ id: 901, h, m, mask: 127, title: T, text: '🌱 امروز فقط یک قدم.', done: false }); }

      body = saved.length ? saved.map((i) => `<div class="card ins" style="margin-top:10px"><span class="q">${pathOf(i.path).icon}</span><div class="grow"><p style="font-size:14px">${esc(i.text)}</p><p class="tiny muted" style="margin-top:4px">${esc(i.src)} · ${faT(i.date.replace(/-/g, '/'))}</p></div><button class="iconbtn" style="width:36px;height:36px;color:var(--muted)" aria-label="حذف کشف" onclick="A.unsave('${i.id}')">${ART.icons.close}</button></div>`).join('')

    } else if (t === 'patterns') {
      const fin = S.records.filter((r) => r.status === 'done' || r.status === 'failed');

      body = fin.length < 2 ? `<div class="card empty" style="margin-top:10px"><span class="ic">🧭</span>برای دیدن الگوها حداقل دو مأموریت را ثبت کن.<br><span class="tiny">الگوها مشاهده‌ی رفتار تو هستند، نه برچسب شخصیتی.</span></div>` :
        `<div class="card" style="margin-top:10px"><p class="bold small">ترس پیش‌بینی‌شده در برابر واقعیت</p><p style="margin-top:4px">${fa(Math.round(100 * easier / fin.length))}٪ مأموریت‌ها <b>راحت‌تر از انتظارت</b> بوده‌اند.</p></div>
        ${fobj ? `<div class="card" style="margin-top:10px"><p class="bold small">حس پرتکرار بعد از اقدام</p><p style="margin-top:4px;font-size:18px">${fobj.e} ${fobj.t}</p></div>` : ''}
        <div class="card" style="margin-top:10px"><p class="bold small" style="margin-bottom:8px">قدم‌های واقعی در هر مسیر</p>${D.paths.map((p) => `<div class="row" style="margin-top:6px"><span class="small" style="width:72px">${p.name}</span><div class="bar grow"><i style="width:${100 * (st.pathSteps[p.id] || 0) / maxS}%;background:${p.color}"></i></div><span class="tiny muted" style="width:26px;text-align:left">${fa(st.pathSteps[p.id] || 0)}</span></div>`).join('')}</div>`;
    } else {
      const recs = S.records.slice().reverse();
      body = recs.length ? recs.map((r) => {
        const m = missionById(r.mid) || { title: r.title || 'مأموریت', path: r.path };
        const o = D.outcomes.find((x) => x.id === r.outcome);
        const f = D.feelings.find((x) => x.id === r.feeling);
        return `<div class="card" style="margin-top:10px"><div class="row between"><b class="small">${pathOf(m.path).icon} ${esc(m.title)}</b><span class="tiny muted">${faT(r.date.replace(/-/g, '/'))}</span></div>
        <p class="small muted" style="margin-top:2px">${r.status === 'abandoned' ? 'بسته شد بدون ثبت نتیجه' : (o ? o.t : '')}${f ? ' · ' + f.e + ' ' + f.t : ''}${r.pre ? ' · سختی پیش‌بینی‌شده ' + fa(r.pre) : ''}</p>

    }
    return `<div class="screen with-nav fade-in"><div class="head"><h1>آینه من</h1><p class="muted small">کشف‌ها و بازتاب‌های تو؛ فقط روی همین دستگاه.</p></div>

        <div><div class="v">🦁 ${fa(wk.filter((r) => r.path === 'courage').length)}</div><div class="tiny muted">شجاعت</div></div>
        <div><div class="v">💡 ${fa(wkSaved)}</div><div class="tiny muted">کشف</div></div></div></div>
      ${body}</div></div>`;

  tabs.world = function () {
    const st = stats();
    return `<div class="screen with-nav fade-in"><div class="head"><h1>جهان من</h1><p class="muted small">هر منطقه با اکسیر و اقدام واقعی در همان مسیر باز می‌شود.</p></div>

  tabs.me = function () {
    const st = stats(), prog = Math.round(100 * (st.xp - st.prevAt) / Math.max(1, st.nextAt - st.prevAt));
    const maxS = Math.max(1, ...Object.values(st.pathSteps));

      <div class="bar" style="margin:8px auto 0;max-width:220px;background:rgba(255,255,255,.15)"><i style="width:${prog}%;background:var(--gold2)"></i></div>

      <div class="pad" style="margin-top:-44px">
      <div class="card"><div class="stats" style="gap:0"><div class="center"><span class="bold gold" style="font-size:20px">${fa(st.xp)}</span><div class="tiny muted">اکسیر</div></div><div class="center"><span class="bold" style="font-size:20px">${fa(st.steps)}</span><div class="tiny muted">قدم واقعی</div></div><div class="center"><span class="bold" style="font-size:20px">🔥 ${fa(st.flame)}</span><div class="tiny muted">شعله</div></div></div></div>
      <div class="section-title">کریستال‌ها <button class="link" onclick="A.openSheet('crystals')">مشاهده همه</button></div>

      <div class="section-title">نیت ۳۰ روزه <button class="link" onclick="A.openSheet('intent')">ویرایش</button></div>

      <div class="section-title">تنظیمات</div>
      <div class="card" style="padding:0 14px">
        <button class="setrow" style="width:100%" onclick="A.openSheet('routines')"><span>🔁</span><span class="grow" style="text-align:right">مدیریت روتین‌ها</span><span class="muted">←</span></button>
        <button class="setrow" style="width:100%" onclick="A.openSheet('notif')"><span>🔔</span><span class="grow" style="text-align:right">اعلان‌ها و ساعت سکوت</span><span class="muted">←</span></button>
        <button class="setrow" style="width:100%" onclick="A.openSheet('profile')"><span>✏️</span><span class="grow" style="text-align:right">نام و مسیرها</span><span class="muted">←</span></button>
        <button class="setrow" style="width:100%" onclick="A.openSheet('privacy')"><span>🔒</span><span class="grow" style="text-align:right">حریم خصوصی و پشتیبان</span><span class="muted">←</span></button>
      </div>
      <p class="tiny muted center" style="margin-top:16px">کیمیاگر · نسخه ۱٫۲ (MVP)</p></div></div>`;
  };

  // ---------- Full screens ----------
  const screens = {};
  screens.mission = function () {
    const m = missionById(ui.params.id), p = pathOf(m.path);
    const busy = S.active && S.active.mid !== m.id;
    return `<div class="screen fade-in"><div style="position:relative;height:170px">${ART.valley()}<div style="position:absolute;inset:0" class="topbar"><button class="iconbtn" style="background:rgba(255,251,242,.85);align-self:flex-start" onclick="A.back()" aria-label="بازگشت">${ART.icons.back}</button></div>
      <div class="badge" style="position:absolute;bottom:-28px;right:50%;transform:translateX(50%);width:64px;height:64px;border-radius:50%;background:var(--paper);border:2px solid var(--gold2);display:grid;place-items:center;font-size:32px;box-shadow:var(--shadow)">${m.hidden ? '🗝️' : p.icon}</div></div>
      <div class="pad" style="padding-top:38px"><div class="center"><span class="chip">${p.name} · ${diffDots(m.d)}</span>${m.hidden ? ' <span class="chip gold">مأموریت مخفی · اختیاری</span>' : ''}<h2 style="font-size:21px;margin-top:8px">${esc(m.title)}</h2></div>
      <div class="stack" style="margin-top:16px">
        <div class="block"><h5>چرا این قدم؟</h5><p class="small">${esc(m.why)}</p></div>
        <div class="block" style="border-color:#BFD6B9;background:#F3F8EE"><h5>اقدام واقعی</h5><p>${esc(m.act)}</p></div>

      </div>
      <div style="margin-top:20px">${busy ? `<div class="warn" style="margin-bottom:10px">یک مأموریت دیگر در جریان است. اول نتیجه آن را ثبت کن یا ببندش.</div><button class="btn" onclick="A.go('doing')">رفتن به مأموریت در جریان</button>` :
        `<button class="btn" onclick="A.startMission('${m.id}')">${S.active ? 'ادامه مأموریت' : 'شروع مأموریت'}</button>`}</div></div></div>`;
  };

  screens.doing = function () {
    if (!S.active) { ui.screen = null; return tabs.home() + nav(); }
    const m = missionById(S.active.mid);
    const total = m.min * 60, elapsed = Math.floor((Date.now() - S.active.startedAt) / 1000), left = Math.max(0, total - elapsed);
    const C = 2 * Math.PI * 76, frac = left / total;
    setTimeout(tickTimer, 1000);
    return `<div class="screen fade-in" style="background:var(--paper)"><div style="position:relative;height:250px">${ART.night()}
      <button class="iconbtn" style="position:absolute;top:14px;right:14px;color:#fff" onclick="A.back()" aria-label="بازگشت به خانه">${ART.icons.back}</button></div>
      <div class="pad center" style="margin-top:-30px;background:var(--paper);border-radius:28px 28px 0 0;position:relative">
      <h2 style="font-size:20px">حالا گوشی را کنار بگذار.</h2>
      <p class="muted" style="margin-top:6px">مأموریتت در دنیای واقعی اتفاق می‌افتد.<br><b style="color:var(--ink)">${esc(m.title)}</b></p>
      <div class="timer-ring" aria-live="polite"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="76" fill="none" stroke="#EDE4CF" stroke-width="9"/><circle id="ring" cx="85" cy="85" r="76" fill="none" stroke="#2A7650" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg><div class="val" id="tval">${fmtClock(left)}</div></div>
      <p class="small muted">🌿 وقتی برگشتی، اینجا منتظرت هستیم.</p>
      <button class="btn" style="margin-top:18px" onclick="A.go('result')">برگشتم</button>
      <button class="link" style="margin-top:6px;color:var(--muted)" onclick="A.openSheet('abandon')">فعلاً نمی‌توانم؛ بستن مأموریت</button>
      <p class="tiny muted" style="margin-top:10px">زندگی واقعی، بهترین تمرین است!</p></div></div>`;
  };
  function fmtClock(s) { return faT(pad(Math.floor(s / 60)) + ':' + pad(s % 60)); }
  function tickTimer() {
    if (ui.screen !== 'doing' || !S.active) return;
    const m = missionById(S.active.mid), total = m.min * 60, left = Math.max(0, total - Math.floor((Date.now() - S.active.startedAt) / 1000));
    const el = document.getElementById('tval'), ring = document.getElementById('ring');
    if (el) el.textContent = left ? fmtClock(left) : '✓';
    if (ring) { const C = 2 * Math.PI * 76; ring.setAttribute('stroke-dashoffset', C * (1 - left / total)); }
    if (left > 0) setTimeout(tickTimer, 1000);
  }

  screens.result = function () {
    const m = missionById(S.active ? S.active.mid : ui.params.id), d = ui.draft;

    draftText(v) { ui.draft.reflection = v; },
    submitResult() {
      const d = ui.draft, act = S.active || { mid: ui.params.id, startedAt: Date.now(), uid: uidGen() };
      const m = missionById(act.mid), before = stats();
      const failed = d.outcome === 'failed', refl = (d.reflection || '').trim();
      const rec = { uid: act.uid, mid: m.id, path: m.path, title: m.title, date: today(), startedAt: act.startedAt, completedAt: Date.now(),
        status: failed ? 'failed' : 'done', outcome: d.outcome, pre: d.pre, feeling: failed ? null : d.feeling, reflection: refl,
        xp: failed ? (refl ? 5 : 0) : m.xp + (refl ? 5 : 0) };
      S.records.push(rec);
      S.insights.push({ id: uidGen(), uid: rec.uid, path: m.path, text: makeInsight(rec, m), src: 'از مأموریت «' + m.title + '»', date: today(), saved: false });
      if (refl) S.insights.push({ id: uidGen(), uid: rec.uid + '-u', path: m.path, text: refl, src: 'نوشته خودت · ' + m.title, date: today(), saved: true });
      S.active = null; save(); syncNotifications();
      if (!failed) afterProgress(before);
      go('success', { uid: rec.uid });
    },
    saveInsight(id) { const i = S.insights.find((x) => x.id === id); if (i) i.saved = true; save(); render(); toast('در آینه ذخیره شد. 🪞'); },
    unsave(id) { const i = S.insights.find((x) => x.id === id); if (i) i.saved = false; save(); render(); },
    smaller(path) {
      const m = pickMission(Date.now() % 1000, path, 1);
      S.day.missionId = m.id; save(); ui.screen = null; ui.tab = 'home'; render(); toast('یک قدم کوچک‌تر برایت گذاشتیم.');
    },
    finish() { ui.screen = null; ui.tab = 'home'; render(); scrollTop(); },
    abandon() {
      if (S.active) { const m = missionById(S.active.mid); S.records.push({ uid: S.active.uid, mid: m.id, path: m.path, title: m.title, date: today(), status: 'abandoned', xp: 0 }); }
      S.active = null; save(); ui.sheet = null; ui.screen = null; ui.tab = 'home'; render();
    },
    microNext: soft(() => { ui.draft.mr = (ui.draft.mr || 0) + 1; render(); }),
    microDone() { const before = stats(); S.micros.push({ date: today(), at: Date.now() }); save(); closeSheet(); toast('🧪 یک قدم واقعی دیگر ثبت شد. +۵ اکسیر'); afterProgress(before); },
    // routine editor
    er(k, v) { ui.draft.er[k] = v; if (k === 'time') { ui._keepScroll = true; render(); } },
    erToggle: soft((k) => { ui.draft.er[k] = !ui.draft.er[k]; render(); }),
    erDay: soft((i) => { ui.draft.er.mask ^= (1 << i); render(); }),
    erTpl(k) { const t = D.routineTemplates.find((x) => x.key === k); Object.assign(ui.draft.er, { key: k, title: t.title, icon: t.icon, xp: t.xp, path: t.path, time: t.time, note: t.note }); render(); },
    saveRoutine(id) {
      const d = ui.draft.er; d.title = (d.title || '').trim();
      if (!d.title) { toast('عنوان روتین را بنویس.'); return; }
      if (d.reminder && !d.mask) { toast('حداقل یک روز را انتخاب کن.'); return; }
      const others = S.routines.filter((r) => r.active && r.id !== id).length;
      if (d.active && others >= routineLimit()) { toast(`فعلاً حداکثر ${fa(routineLimit())} روتین فعال. یکی را متوقف کن.`); return; }
      if (id) Object.assign(S.routines.find((r) => r.id === id), d);
      else S.routines.push(Object.assign({ id: uidGen(), key: d.key || 'custom' }, d));
      ui.draft = {}; save(); syncNotifications(); openSheet('routines'); toast('ذخیره شد.');
    },
    delRoutine(id) { S.routines = S.routines.filter((r) => r.id !== id); ui.draft = {}; save(); syncNotifications(); openSheet('routines'); toast('روتین حذف شد. سابقه‌اش در آمار می‌ماند.'); },
    setToggle: soft((k) => { S.settings[k] = !S.settings[k]; save(); syncNotifications(); render(); }),
    setTime(k, v) { if (!v) return; S.settings[k] = v; save(); syncNotifications(); ui._keepScroll = true; render(); },
    permLater() { S.settings.permAsked = true; save(); closeSheet(); },
    saveIntent() { S.intention = document.getElementById('it').value.slice(0, 300); save(); closeSheet(); },
    ppick: soft((id) => { const s = ui.draft.pp, i = s.indexOf(id); if (i >= 0) s.splice(i, 1); else if (s.length < 2) s.push(id); else toast('حداکثر دو مسیر.'); render(); }),
    setDaily: soft((n) => { S.dailyMin = n; save(); render(); }),
    saveProfile() { const n = document.getElementById('pn').value.trim(); if (n) S.name = n; S.paths = ui.draft.pp.slice(); ui.draft = {}; save(); closeSheet(); toast('ذخیره شد.'); },
    exportData() {
      const txt = JSON.stringify(S);
      const done = () => toast('پشتیبان کپی شد؛ آن را جایی امن نگه دار.');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); else fallbackCopy(txt, done);
    },
    importData() {
      try { const o = JSON.parse(document.getElementById('imp').value); if (!o || !o.v) throw 0; S = Object.assign(defaults(), o); save(); syncNotifications(); closeSheet(); toast('بازگردانی شد.'); }
      catch (e) { toast('متن پشتیبان معتبر نیست.'); }
    },
    resetAll() { localStorage.removeItem(KEY); S = defaults(); ui.sheet = null; ui.ob = 0; ui.screen = null; ui.draft = {}; syncNotifications(); render(); }
  };
  function fallbackCopy(txt, cb) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); cb(); } catch (e) { toast('کپی ممکن نشد.'); } t.remove(); }

  // اولین مأموریت بعد از onboarding
  screens.first = function () {
    const m = todayMission(), p = pathOf(m.path);
    return `<div class="screen" style="background:var(--bg)"><div style="position:relative;height:230px">${ART.valley()}<h2 style="position:absolute;top:22px;width:100%;text-align:center;color:var(--g800)">اولین مأموریت تو</h2></div>
      <div class="pad" style="margin-top:-60px;position:relative"><div class="card center fade-in" style="padding:22px 16px">
      <div style="width:70px;height:70px;margin:-56px auto 6px;border-radius:50%;background:var(--paper);border:2px solid var(--gold2);display:grid;place-items:center;font-size:34px">${p.icon}</div>
      <h3 style="font-size:19px">یک قدم کوچک</h3><p style="margin-top:6px">${esc(m.act)}</p>
      <div class="meta3"><div>مهارت<b>${p.name}</b></div><div>زمان<b>${fa(m.min)} دقیقه</b></div><div>پاداش<b class="gold">${fa(m.xp)} اکسیر</b></div></div>
      <button class="btn" onclick="A.startMission('${m.id}')">شروع مأموریت</button>
      <button class="link" style="margin-top:4px" onclick="A.finish()">بعداً؛ اول خانه را ببینم</button></div></div></div>`;
  };

  // ---------- Boot ----------
  if (S.active && Date.now() - S.active.startedAt > 24 * 3600e3) {
    // مأموریت رهاشده بعد از ۲۴ ساعت بدون جریمه بسته می‌شود
    const m = missionById(S.active.mid);
    if (m) S.records.push({ uid: S.active.uid, mid: m.id, path: m.path, title: m.title, date: today(), status: 'abandoned', xp: 0 });
    S.active = null; save();
  }
  if (S.onboarded && S.active) ui.screen = 'doing';
  S.lastSeen = today(); save();
  render();
  syncNotifications();
  refreshCapPerm();
  if (CAP && CAP.App && CAP.App.addListener) { try { CAP.App.addListener('backButton', () => window.appBack()); } catch (e) { } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.day.date !== today() || LN) syncNotifications(); refreshCapPerm(); render(); } });
})();

</script>
</body>
</html>
