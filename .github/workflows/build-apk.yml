name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android

      - name: Notification icon and permission
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_kimiagar.png android/app/src/main/res/drawable/ic_stat_kimiagar.png
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M

      - name: Use fixed signing key (so updates install over previous version)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          elif [ -f debug.keystore.b64.txt ]; then
            base64 -d debug.keystore.b64.txt > ~/.android/debug.keystore
          else
            echo "No keystore found; a new key will be created."
          fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare output files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kimiagar.apk
          cp out/kimiagar.apk out/kimiagar-apk.txt

      - name: Upload APK for direct install
        uses: actions/upload-artifact@v4
        with:
          name: kimiagar-apk
          path: out/kimiagar.apk

      - name: Upload copy for email and messengers
        uses: actions/upload-artifact@v4
        with:
          name: kimiagar-for-email
          path: out/kimiagar-apk.txt

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kimiagar build ${{ github.run_number }}
          files: out/kimiagar.apk
          make_latest: true
